<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공구 허브 주소 설정</title>
<style>
  body {
    margin: 0;
    padding: 18px;
    width: 320px;
    background: #0a0a0a;
    color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    font-size: 13px;
    line-height: 1.6;
  }
  h1 { margin: 0 0 6px; font-size: 15px; }
  p { margin: 0 0 12px; color: #a3a3a3; font-size: 12px; }
  label { display: block; margin-bottom: 6px; color: #a3a3a3; font-size: 12px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 10px;
    border: 1px solid #404040;
    border-radius: 8px;
    background: #171717;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #2563eb; }
  button {
    margin-top: 10px;
    padding: 9px 16px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .msg { margin-top: 10px; font-size: 12px; color: #4ade80; min-height: 18px; }
  .msg.error { color: #f87171; }
  .hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid #262626; color: #737373; font-size: 11.5px; }
</style>
</head>
<body>
  <h1>공구 허브 주소</h1>
  <p>인스타 프로필에서 담기 버튼을 누르면 이 주소로 정보가 넘어갑니다.</p>

  <label for="siteUrl">사이트 주소</label>
  <input id="siteUrl" type="text" placeholder="https://내사이트.up.railway.app" spellcheck="false">
  <button id="save">저장</button>
  <div class="msg" id="msg"></div>

  <div class="hint">
    주소는 공구 허브에 로그인했을 때 브라우저 주소창에 보이는 것 그대로 넣으시면 됩니다.
    뒤에 <code>/creators</code> 같은 건 빼고 <code>.app</code> 까지만요.
  </div>

  <script src="options.js"></script>
</body>
</html>
